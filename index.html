<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envelope Animation Only</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fde4f2;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "Poppins";
        overflow: hidden;
      }

      #welcomeModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
      }

      .envebot,
      .envetop {
        width: 100%;
        position: absolute;
        transition: all 1.2s ease-in-out;
      }

      .envebot {
        bottom: 0;
        height: 100vh;
      }

      .envetop {
        top: 0;
        height: 100%;
      }

      .btn-welcome {
        position: relative;
        z-index: 10;
        width: 4.2rem;
        height: 4.2rem;
        background-color: black;
        margin-top: 2.2rem;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        opacity: 0;
      }

      .container {
        width: 88%;
        height: 90vh;
        background-color: white;
        margin: 0 auto;
      }

      .page1,
      .page2 {
        position: relative;
      }

      .page2 {
        display: none;
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <!-- Modal Welcome -->
    <div id="welcomeModal">
      <img
        src="./img/envebot.png"
        alt="Bottom Envelope"
        class="envebot"
        id="envebot"
      />
      <img
        src="./img/envetop.png"
        alt="Top Envelope"
        class="envetop"
        id="envetop"
      />
      <button class="btn-welcome" onclick="startSegmen()" id="open-btn">
        Open
      </button>
    </div>
    <img
      src="./img/love.png"
      style="width: 30%; position: absolute; top: -2.4rem; left: 0"
    />
    <img
      src="./img/butterfly.png"
      style="width: 30%; position: absolute; top: 13.2rem; left: 1rem"
    />
    <img
      src="./img/cloud.png"
      style="width: 30%; position: absolute; top: 22rem; right: 0"
    />
    <img
      src="./img/cloud.png"
      style="width: 30%; position: absolute; top: 20rem; left: 0"
    />
    <img
      src="./img/cloud.png"
      style="width: 30%; position: absolute; top: 28rem; left: 2rem"
    />
    <img
      src="./img/coquette.png"
      style="width: 30%; position: absolute; top: -2.4rem; right: 0"
    />
    <div class="container">
      <div class="page1" id="page1">
        <img
          src="./img/happygfday.png"
          style="width: 100%; position: absolute"
        />
        <p
          style="
            position: absolute;
            z-index: 100;
            margin-top: 84%;
            text-align: center;
            width: 100%;
            color: #eea1cd;
          "
        >
          to the most beautiful <br />
          person in my life
        </p>
        <img
          src="./img/bunny.png"
          style="
            width: 72%;
            position: absolute;
            margin-left: 14%;
            margin-top: 72%;
          "
        />
        <button
          id="btn-to2"
          onclick="segmen(1)"
          style="
            width: 4rem;
            height: 4rem;
            background-color: white;
            position: absolute;
            top: 25rem;
            left: 40%;
            opacity: 0;
            z-index: 1000;
          "
        >
          Next Segmen
        </button>
      </div>
      <div class="page2" id="page2">
        <div style="position: absolute; margin: 0 auto; width: 100%; padding: 2rem;">
          <h2
            style="
              font-family: 'Leckerli One';
              text-align: center;
              width: 100%;
              color: #eea1cd;
              margin-top: 6rem;
              font-size: 2rem;
            "
            id="type1"
          ></h2>
          <p
            id="type2"
            style="color: #eea1cd; width: 100%; text-align: center"
          ></p>
        </div>

        <iframe
          id="flowerFrame"
          src="flower.html"
          style="
            width: 100%;
            position: absolute;
            bottom: 6rem;
            border: none;
            height: 140%;
          "
        ></iframe>
      </div>
    </div>

    <script>
      let typingIndex = 0;
      let charIndex = 0;
      let typingTarget = null;
      const teks = [
        "flowers for u, my lovee!",
        "just like my love for u, this flower will never die :p",
      ];

      function typeWriter(callback) {
        if (charIndex < teks[typingIndex].length) {
          typingTarget.innerHTML += teks[typingIndex].charAt(charIndex);
          charIndex++;
          setTimeout(() => typeWriter(callback), 90);
        } else {
          if (callback) callback();
        }
      }
      function startSegmen() {
        const envebot = document.getElementById("envebot");
        const envetop = document.getElementById("envetop");
        const open = document.getElementById("open-btn");

        envebot.style.bottom = "-52%";
        envetop.style.top = "-56%";
        open.style.top = "-56%";
      }

      function segmen(index) {
        if (index === 1) {
          const page1 = document.getElementById("page1");
          const page2 = document.getElementById("page2");
          page1.style.display = "none";
          page2.style.display = "block";

          // Tambahkan konten ke page2 (opsional)
          // Jalankan typewriter untuk kedua teks
          typingIndex = 0;
          charIndex = 0;
          typingTarget = document.getElementById("type1");
          typingTarget.innerHTML = "";
          typeWriter(() => {
            typingIndex = 1;
            charIndex = 0;
            typingTarget = document.getElementById("type2");
            typingTarget.innerHTML = "";
            typeWriter();
          });
        }
      }
    </script>
  </body>
</html>
