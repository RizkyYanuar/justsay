<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envelope Animation Only</title>
    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #000;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        overflow: hidden;
      }

      #welcomeModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
      }

      .envebot,
      .envetop {
        width: 100%;
        position: absolute;
        transition: all 1.2s ease-in-out;
      }

      .envebot {
        bottom: 0;
        height: 100vh;
      }

      .envetop {
        top: 0;
        height: 100%;
      }

      .btn-welcome {
        position: relative;
        z-index: 10;
        width: 4.2rem;
        height: 4.2rem;
        background-color: black;
        margin-top: 2.2rem;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- Modal Welcome -->
    <div id="welcomeModal">
      <img src="./img/envebot.png" alt="Bottom Envelope" class="envebot" id="envebot" />
      <img src="./img/envetop.png" alt="Top Envelope" class="envetop" id="envetop" />
      <button class="btn-welcome" onclick="startSegmen()">Open</button>
    </div>

    <script>
      function startSegmen() {
        const envebot = document.getElementById("envebot");
        const envetop = document.getElementById("envetop");

        // Geser amplop dengan transisi yang halus
        envebot.style.bottom = "-52%";
        envetop.style.top = "-56%";
      }
    </script>
  </body>
</html>
