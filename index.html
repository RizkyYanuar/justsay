<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>little gift for u</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      * {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #fde4f2;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "Poppins";
        overflow: hidden;
      }

      #welcomeModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1000;
      }

      .envebot,
      .envetop {
        width: 100%;
        position: absolute;
        transition: all 1.2s ease-in-out;
      }

      .envebot {
        bottom: 0;
        height: 100vh;
      }

      .envetop {
        top: 0;
        height: 100%;
      }

      .btn-welcome {
        position: relative;
        z-index: 10;
        width: 4.2rem;
        height: 4.2rem;
        background-color: black;
        margin-top: 2.2rem;
        border: none;
        border-radius: 8px;
        color: white;
        cursor: pointer;
        opacity: 0;
      }

      .container {
        width: 88%;
        height: 90vh;
        background-color: white;
        margin: 0 auto;
      }

      .page1,
      .page2 {
        position: relative;
      }

      .page2 {
        display: none;
        width: 100%;
        height: 100%;
        position: relative;
      }

      .slider-container {
        width: 100%;
        overflow: hidden;
        position: relative;
        height: 400px; /* Sesuaikan tinggi gambar */
      }

      .slider-track {
        display: flex;
        width: max-content;
        animation: scroll-left 15s linear infinite;
      }

      .slider-track img {
        height: 160px;
        width: auto;
        margin-right: 10px;
        border-radius: 2px;
        object-fit: cover;
      }

      @keyframes scroll-left {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      .photos {
        width: 100%;
        height: 240px;
        background-color: black;
        background-image: url("/img/us6.jpg");
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <audio id="bgm">
      <source src="salvatore.mp3" type="audio/mpeg" />
    </audio>
    <!-- Modal Welcome -->
    <div id="welcomeModal">

      <img

        class="envetop"
        id="envetop"
      />

        Open
      </button>
    </div>
    <img
      src="./img/love.png"
      style="width: 30%; position: absolute; top: -2.4rem; left: 0"
    />
    <img
      src="./img/butterfly.png"
      style="width: 30%; position: absolute; top: 13.2rem; left: 1rem"
    />
    <img
      src="./img/cloud.png"
      style="width: 30%; position: absolute; top: 22rem; right: 0"
    />
    <img
      src="./img/cloud.png"
      style="width: 30%; position: absolute; top: 20rem; left: 0"
    />
    <img
      src="./img/cloud.png"

    />
    <img

    />
    <div class="container">

        <img

          "
        />
        <button
          id="btn-to2"

          style="
            width: 4rem;
            height: 4rem;
            background-color: white;
            position: absolute;
            top: 25rem;

            z-index: 1000;
          "

          Next Segmen

      <div class="page2" id="page2">
        <button
          id="btn-to2"

            width: 4rem;

            background-color: white;
            position: absolute;
            top: 0;

            z-index: 1000;

        <div

        >
          <h2
            style="
              font-family: 'Leckerli One';
              text-align: center;
              width: 100%;
              color: #eea1cd;
              margin-top: 6rem;
              font-size: 2rem;
            "
            id="type1"
          >
            flowers for u,<br />

          </h2>
          <p

            style="color: #eea1cd; width: 100%; text-align: center"

        </div>

        <iframe

        <button

            bottom: 6rem;

          "
        >

        <div

          "
        >
          <div class="slider-container">
            <div class="slider-track">
              <img src="./img/us1.jpg" />
              <img src="./img/us2.jpg" />
              <img src="./img/us3.jpg" />
              <img src="./img/us4.jpg" />
              <img src="./img/us5.jpg" />
              <!-- Duplikasi agar looping seamless -->
              <img src="./img/us1.jpg" />
              <img src="./img/us2.jpg" />
              <img src="./img/us3.jpg" />
              <img src="./img/us4.jpg" />
              <img src="./img/us5.jpg" />
            </div>
          </div>
          <p
            style="
              font-family: 'Leckerli One';
              text-align: center;
              width: 100%;

              margin-top: -15rem;
            "

            Our Moment!
          </p>
          <p

            style="
              color: #eea1cd;
              width: 100%;
              text-align: center;
              font-size: 11px;
            "
          ></p>
        </div>
        <img
          src="./img/pinkdoll.png"
          style="width: 80%; position: absolute; bottom: -20px; left: 10%"
        />
      </div>
      <div
        class="page4"
        id="page4"
        style="display: none; width: 100%; height: 100%; position: relative"
      >
        <button
          id="btn-to2"
          onclick="segmen(4)"
          style="
            width: 4rem;
            height: 4rem;
            background-color: white;
            position: absolute;
            opacity: 0;
            z-index: 1000;
            bottom: 6rem;
            left: 40%;

        <div

        >

            "

            "
          ></p>
        </div>
        <img

        />
      </div>
      <div
        class="page5"
        id="page5"
        style="display: none; width: 100%; height: 100%; position: relative"
      >
        <button
          id="btn-to2"

          style="
            width: 4rem;

            background-color: white;
            position: absolute;
            opacity: 0;
            z-index: 1000;
            bottom: 6rem;

        </button>
        <div
          style="
            position: absolute;

            text-align: center;
          "
        >
          <p
            style="
              font-family: 'Leckerli One';
              text-align: center;
              width: 100%;
              color: #eea1cd;
              font-size: 1.3rem;
              margin-top: 1rem;
              margin-left: -5.6rem;
              margin-bottom: 1rem;
            "
          >
            Dear Love,
          </p>
          <p
            id="type5"
            style="
              color: #eea1cd;
              width: 100%;
              text-align: start;
              font-size: 11px;
            "
          ></p>
          <p
            style="
              font-family: 'Leckerli One';
              text-align: center;
              width: 100%;
              color: #eea1cd;
              font-size: 1.3rem;
              margin-top: 1rem;
              margin-left: 2rem;
            "
            id="type6"
          ></p>
        </div>
        <img
          src="./img/pinkdoll.png"
          style="width: 80%; position: absolute; bottom: -20px; left: 10%"
        />
      </div>
      <div
        class="page6"
        id="page6"
        style="display: none; width: 100%; height: 100%; position: relative"
      >
        <div
          style="
            position: absolute;
            width: 100%;
            padding: 2rem;
            text-align: center;
          "
        >
          <div class="photos"></div>
          <p
            style="
              font-family: 'Leckerli One';
              text-align: center;
              width: 100%;
              color: #eea1cd;
              font-size: 1.3rem;
              margin-top: 1rem;
            "
            id=""
          >
            meeting u was the highlight of my life.
          </p>
        </div>
        <img
          src="./img/pinkdoll.png"
          style="width: 80%; position: absolute; bottom: -20px; left: 10%"
        />
      </div>
    </div>

    <script>
      let typingIndex = 0;
      let charIndex = 0;
      let typingTarget = null;
      const teks = [
        "just like my love for u, this flower will never die :p",
        "di momen-momen yang mungkin keliatannya biasa aja, tapi entah kenapa berasa spesial di hati aku. foto-foto ini nyimpen banyak cerita, dari yang receh sampe yang gak pernah kita ceritain ke siapa-siapa. Kadang cape bareng, kadang ketawa ga jelas, kadang cuma saling mandang sambil diem. tapi semuanya selalu terasa cukup, karena ada kamu di situ.",
        "Makasi uda bertahan sampe sejauh ini ya sayang, pasti banyak hal hal yang perlu kamu lewatin buat jadi diri kamu yang sekarang, aku tau kamu jalaninnya ga semudah yang orang orang pikirin, bahkan uda banyak lika liku kehidupan yang kamu lewatin. meskipun kadang capenya ngga kamu liatin ke aku dan kamu pendem sendiri, tapi aku ngerti kamu uda berusaha dengan segala yang kamu punya sampe titik ini. kamu kuat sayang, i'm so proud of you!",
        "u are good enough, u are beautiful, u are worthy. nothing is wrong with u. u are who u are supposed to be. jangan lupa buat nikmatin hal hal yang kamu laluin ya sayang, kalo ada apa apa pun kamu jangan takut, ada aku disini, selalu siap buat dengerin kamu. it's time to be proud of all the progress u've made so far. dan selamat jadi anak UNPAS yaa pacarku!.",
        "Sincerely, ur bf",
      ];

      function typeWriter(callback) {
        if (charIndex < teks[typingIndex].length) {
          typingTarget.innerHTML += teks[typingIndex].charAt(charIndex);
          charIndex++;
          setTimeout(() => typeWriter(callback), 82);
        } else {
          if (callback) callback();
        }
      }
      function startSegmen() {
        const envebot = document.getElementById("envebot");
        const envetop = document.getElementById("envetop");
        const open = document.getElementById("open-btn");
        document
          .getElementById("bgm")
          .play()
          .catch(() => {});

        envebot.style.bottom = "-52%";
        envetop.style.top = "-56%";
        open.style.top = "-56%";
      }

      function segmen(index) {
        if (index === 1) {
          const page1 = document.getElementById("page1");
          const page2 = document.getElementById("page2");
          page1.style.display = "none";
          page2.style.display = "block";

          // Tambahkan konten ke page2 (opsional)
          // Jalankan typewriter untuk kedua teks
          typingIndex = 0;
          charIndex = 0;
          typingTarget = document.getElementById("type2");
          typingTarget.innerHTML = "";
          typeWriter();
        } else if (index === 2) {
          const page2 = document.getElementById("page2");
          const page3 = document.getElementById("page3");
          page2.style.display = "none";
          page3.style.display = "block";
          typingIndex = 1;
          charIndex = 0;
          typingTarget = document.getElementById("type3");
          typeWriter();
        } else if (index === 3) {
          const page3 = document.getElementById("page3");
          const page4 = document.getElementById("page4");
          page3.style.display = "none";
          page4.style.display = "block";
          typingIndex = 2;
          charIndex = 0;
          typingTarget = document.getElementById("type4");
          typeWriter();
        } else if (index === 4) {
          const page4 = document.getElementById("page4");
          const page5 = document.getElementById("page5");
          page4.style.display = "none";
          page5.style.display = "block";
          typingIndex = 3;
          charIndex = 0;
          typingTarget = document.getElementById("type5");
          typingTarget.innerHTML = "";
          typeWriter(() => {
            typingIndex = 4;
            charIndex = 0;
            typingTarget = document.getElementById("type6");
            typingTarget.innerHTML = "";
            typeWriter();
          });
        } else if (index === 5) {
          const page5 = document.getElementById("page5");
          const page6 = document.getElementById("page6");
          page5.style.display = "none";
          page6.style.display = "block";
          setTimeout(() => {
            envebot.style.bottom = "0%";
            envetop.style.top = "0%";
            open.style.top = "0%";
          }, 3000);
        }
      }
    </script>
  </body>
</html>
